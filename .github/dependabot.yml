version: 2

# Each update waits 14 days after its release, so a broken or taken-over release is found by others
# first. No Composer: the lock serves only the test tools, and the newest job takes their updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  # The images the job of the workflows runs in, and the image of the demo.
  - package-ecosystem: docker
    directories:
      - /demo
      - /docker/actionlint
      - /docker/zizmor
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ['*']
