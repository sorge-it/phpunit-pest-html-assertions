name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.stack }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # PHPUnit 12, Pest 4, Laravel 12 and Symfony 7.4, the oldest stack the package supports.
          - php: '8.3'
            stack: PHPUnit 12 · Pest 4 · Laravel 12 · Symfony 7.4
            install: >-
              composer update --no-interaction --prefer-dist
              --with phpunit/phpunit:^12.5
              --with pestphp/pest:^4.7
              --with pestphp/pest-plugin-type-coverage:^4.0
              --with illuminate/testing:^12.0
              --with symfony/css-selector:^7.4
              --with symfony/dom-crawler:^7.4
              --with symfony/framework-bundle:^7.4
              --with symfony/http-foundation:^7.4
          # The newest versions that run on PHP 8.4.
          - php: '8.4'
            stack: newest
            install: composer update --no-interaction --prefer-dist
          # The versions of composer.lock.
          - php: '8.5'
            stack: locked
            install: composer install --no-interaction --prefer-dist

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
          coverage: none

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Test
        run: composer test

      # The demo app installs the package from this checkout, as a project does: PHPStan reports
      # the string check, and Pest shows the line of the test, not a frame of the package.
      # Both runs fail on purpose, so their output is read, not their exit code.
      - name: Demo
        working-directory: demo/app
        run: |
          composer install --no-interaction --no-progress
          phpstan=$(vendor/bin/phpstan analyse --no-progress --error-format=json || true)
          grep -q html.markupAsString <<< "$phpstan"
          pest=$(vendor/bin/pest --colors=never tests/CartTest.php || true)
          grep -q 'at tests/CartTest.php' <<< "$pest"
          if grep -q 'src/PHPUnit/' <<< "$pest"; then echo 'A frame of the package is in the trace.'; exit 1; fi
